spring.application.name=ljzp-backend
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.acunese.ljzp.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/cropdisease?serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD
server.port=9999
server.servlet.context-path=/api
file.ip=localhost
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Flask inference service base URL
flask.base-url=http://localhost:5001




# Weather integration defaults
weather.default-latitude=30.67
weather.default-longitude=104.06
weather.cache-ttl-minutes=45
weather.refresh-interval-ms=3600000

# 讯飞星火大模型配置（公开仓库请保留占位符，本地运行时替换为真实值）
llm.spark.app-id=YOUR_APP_ID
llm.spark.api-key=YOUR_API_KEY
llm.spark.api-secret=YOUR_API_SECRET
llm.spark.wss-url=wss://spark-api.xf-yun.com/v1.1/chat
llm.spark.model-version=general

# 传感器数据配置
sensor.default-device-id=DEVICE_001
sensor.data-retention-days=90

# --- MQTT Broker Configuration ---
# 请根据实际部署环境填写 Broker 连接信息
mqtt.enabled=false
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.username=
mqtt.broker.password=
mqtt.client.id=njzp-backend-service

# --- MQTT Topics ---
# 订阅硬件上报数据的主题 (使用通配符 '+' 匹配所有 deviceId)
mqtt.topic.sensor-upload=device/sensor/upload/+
# 定义硬件控制指令的基础主题，最终主题 = 前缀 + 设备ID
mqtt.topic.control-prefix=device/control/

# Demo dashboard seed data
app.seed-sensor-data=true
app.sensor-table-auto-update=true
app.seed-demo-records=true
app.seed-default-avatar=true

# --- Hardware TCP Control (mirrors Android APP socket) ---
hardware.tcp.enabled=false
hardware.tcp.host=192.168.4.1
hardware.tcp.port=8080
hardware.tcp.default-device-id=DEVICE_001
hardware.tcp.reconnect-delay=3s
hardware.tcp.read-timeout=6s
hardware.tcp.connect-timeout=5s
# 预留多设备配置示例
# hardware.tcp.devices[0].device-id=DEVICE_001
# hardware.tcp.devices[0].host=192.168.4.1
# hardware.tcp.devices[0].port=8080
